name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      - name: Checkout OPL Framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab
          path: framework
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Pandoc for publication bundle tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - name: Run fast contract suite
        working-directory: repo
        env:
          OPL_FRAMEWORK_ROOT: ${{ github.workspace }}/framework
        run: bash scripts/verify.sh fast
